# Book settings
title: Pendata Fadimas
author: Fahdimas Sakmal

# Project information
# Hapus baris logo yang di atas ini agar tidak bentrok

# Execution settings
execute:
  execute_notebooks: "off"

# Pengaturan HTML (Tempat logo dan CSS yang benar)
html:
  logo: _static/logo.png
  extra_css:
    - _static/custom.css
  favicon: _static/logo.png
  use_repository_button: true
  use_issues_button: true

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/Fadimas-Akmal/Pendata  # Pastikan ini link repo kamu sendiri ya
  path_to_book: docs
  branch: main